name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Installation des dépendances
        run: pip install -r requirements_test.txt
      - name: Lint (ruff)
        run: ruff check custom_components tests
      - name: Tests
        run: pytest
