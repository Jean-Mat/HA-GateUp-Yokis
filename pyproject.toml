[project]
name = "ha-gateup-yokis"
version = "0.1.0"
description = "Intégration Home Assistant pour les volets Yokis via l'API cloud Yno UP"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# Même convention d'imports que Home Assistant
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
